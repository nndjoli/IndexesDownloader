name: Download index histories

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile Indexes.py RunIndexes.py

      - name: Download index histories
        run: python RunIndexes.py

      - name: Upload generated CSV files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-histories-${{ github.run_number }}
          path: index_histories/
          if-no-files-found: warn
          retention-days: 30
